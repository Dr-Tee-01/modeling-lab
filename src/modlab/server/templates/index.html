<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#050A16">
<link rel="icon" href="{{ url_for('static', filename='icons/favicon.svg') }}" type="image/svg+xml">
<link rel="icon" href="{{ url_for('static', filename='icons/favicon-32.png') }}" sizes="32x32" type="image/png">
<link rel="icon" href="{{ url_for('static', filename='icons/favicon-16.png') }}" sizes="16x16" type="image/png">
<link rel="apple-touch-icon" href="{{ url_for('static', filename='icons/apple-touch-icon.png') }}">
<link rel="manifest" href="{{ url_for('static', filename='icons/site.webmanifest') }}">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ModeLab AI</title>
<meta name="description" content="ModeLab AI: epidemics, 3D shapes, stock markets and a Snake AI on one numerical toolkit, computed live, with illustrated explanations and an AI tutor that answers in Hinglish or English.">
<script>
  // Dark navy is the default; a saved choice wins. Applied before first paint, so there is no flash.
  (function () { let t = null; try { t = localStorage.getItem('ml-theme'); } catch (e) {} document.documentElement.dataset.theme = t === 'light' ? 'light' : 'dark'; })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..750&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js" defer></script>
<script type="module" src="{{ url_for('static', filename='js/app.js') }}"></script>
</head>
<body>
<div class="app" id="app">
  <aside class="side" id="side" aria-label="Navigation">
    <div class="side-head">
      <a class="brand" href="#/" aria-label="ModeLab AI home">
        <img class="brand-mark" src="{{ url_for('static', filename='icons/favicon.svg') }}" width="26" height="26" alt="">
        <span class="wordmark">ModeLab<span class="ai-badge">AI</span></span>
      </a>
    </div>
    <button class="search-btn" type="button" data-palette>
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg>
      Jump to a model<kbd>⌘K</kbd>
    </button>
    <nav class="nav" id="nav" aria-label="Models"></nav>
    <div class="side-foot">
      <span class="status-pill" id="status" title="Server health"><i></i><span>connecting…</span></span>
      <button class="icon-btn" type="button" id="theme" aria-label="Switch theme"></button>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>
  <div style="min-width:0">
    <header class="topbar">
      <button class="icon-btn" type="button" id="menu" aria-label="Open navigation" aria-controls="side" aria-expanded="false"></button>
      <a class="brand" href="#/" aria-label="ModeLab AI home"><img class="brand-mark" src="{{ url_for('static', filename='icons/favicon.svg') }}" width="22" height="22" alt=""><span class="wordmark">ModeLab<span class="ai-badge">AI</span></span></a>
      <button class="icon-btn" type="button" data-palette aria-label="Jump to a model"></button>
    </header>
    <main class="content" id="view" tabindex="-1"></main>
  </div>
</div>
<noscript><p style="padding:24px">ModeLab AI needs JavaScript to talk to its server.</p></noscript>
</body>
</html>
