name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          pip install -r requirements.txt
          pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
      - name: Test
        run: pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t modelab-ai .
      - name: Run container and smoke-test the API
        run: |
          docker run -d --name app -p 7860:7860 modelab-ai
          for i in $(seq 1 60); do curl -fs http://localhost:7860/api/health && break; sleep 2; done
          set -e
          for path in \
            "/" \
            "/api/spread/sir/fit" \
            "/api/shape/spectral?mesh=cat4&k=15" \
            "/api/crossover/vix-events" \
            "/api/crossover/crash-shapes" \
            "/api/markets/volatility?ticker=SPY" \
            "/api/agents/snake/episode?agent=bfs&seed=1"; do
            code=$(curl -s -o /tmp/out -w '%{http_code}' "http://localhost:7860$path")
            echo "$code $path"; test "$code" = 200
          done
          job=$(curl -fs -X POST localhost:7860/api/jobs -H 'Content-Type: application/json' \
                -d '{"kind":"lstm_trap","ticker":"SPY","epochs":1,"window":20}' | python3 -c 'import json,sys; print(json.load(sys.stdin)["job"]["id"])')
          for i in $(seq 1 90); do
            status=$(curl -fs "localhost:7860/api/jobs/$job" | python3 -c 'import json,sys; print(json.load(sys.stdin)["job"]["status"])')
            [ "$status" = done ] && break; [ "$status" = failed ] && exit 1; sleep 2
          done
          echo "lstm_trap job: $status"; test "$status" = done
      - name: Smoke-test every UI view spec against the container
        run: BASE=http://localhost:7860 NODE_NO_WARNINGS=1 node tools/check_views.mjs spread shape markets crossover agents bigdata
      - name: Container logs
        if: always()
        run: docker logs app || true

  deploy:
    runs-on: ubuntu-latest
    needs: [test, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Push to the Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          if [ -z "$HF_TOKEN" ] || [ -z "$HF_SPACE" ]; then
            echo "::notice::Skipping deploy: set the HF_TOKEN secret and the HF_SPACE variable (e.g. yourname/modelab-ai)."
            exit 0
          fi
          pip install "huggingface_hub>=0.30,<2"
          python deploy/push_space.py "$HF_SPACE"
